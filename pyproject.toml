[project]
name = "people-intelligence-agent"
version = "0.1.0"
description = "Governable AI agent over synthetic People data — reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Isil Berkunis" }]

dependencies = [
    "anthropic>=0.40.0",
    "google-genai>=0.3.0",
    "google-cloud-bigquery>=3.25.0",
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "sqlglot>=25.0.0",
    "faker>=30.0.0",
    "pyarrow>=17.0.0",
    "prometheus-client>=0.21.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
]

[project.scripts]
pia = "agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/llm", "src/governance", "src/storage", "src/observability"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "RET", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"
